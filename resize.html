<!DOCTYPE html>
<html>
<head><title>Resize Logo</title></head>
<body>
<canvas id="canvas" width="128" height="128"></canvas>
<textarea id="webpData" style="width:100%;height:150px;"></textarea>
<textarea id="pngData" style="width:100%;height:150px;"></textarea>
<script>
const img = new Image();
img.onload = () => {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, 0, 0, 128, 128);
    
    document.getElementById('webpData').value = canvas.toDataURL('image/webp', 0.9);
    document.getElementById('pngData').value = canvas.toDataURL('image/png');
    console.log("DONE_RESIZING");
};
img.src = 'images/logo.PNG';
</script>
</body>
</html>
