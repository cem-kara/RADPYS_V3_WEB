<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description"
        content="RADPYS V3 fiyatları — Başlangıç (1.500 ₺/ay), Standart (3.500 ₺/ay) ve Pro (7.000 ₺/ay) paket seçenekleri ile 1, 3, 6 ve 12 aylık esnek fiyatlandırma." />
    <title>Fiyatlandırma — RADPYS V3</title>
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link
        href="https://api.fontshare.com/v2/css?f[]=clash-display@300,400,500,600,700&f[]=manrope@300,400,500,600,700&f[]=jetbrains-mono@400,500&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/tailwind.config.js"></script>
    <link rel="stylesheet" href="assets/css/tokens.css" />
</head>

<body>
    <div id="site-nav"></div>

    <main>
        <section class="relative pt-40 pb-12 overflow-hidden">
            <div class="blob blob-teal" style="top:-10%; left:-10%; width:520px; height:520px; border-radius:9999px">
            </div>
            <div class="blob blob-purple" style="top:10%; right:-15%; width:560px; height:560px; border-radius:9999px">
            </div>
            <div class="absolute inset-0 bg-grid bg-grid-fade opacity-70"></div>
            <div class="relative container-narrow text-center">
                <span class="section-label" style="justify-content:center; display:inline-flex">Fiyatlandırma</span>
                <h1 class="mt-6 font-display text-5xl md:text-7xl leading-[1] tracking-[-0.03em]">
                    <span class="reveal-mask d1"><span>Esnek fiyat.</span></span>
                    <span class="reveal-mask d2"><span>Tam kontrol.</span></span>
                </h1>
                <p class="reveal mt-8 max-w-2xl mx-auto text-slate-300 text-lg">Kurumunuzun kapasitesine göre üç net
                    paket. Esnek ödeme periyotları, gizli maliyet yok, sözleşme yükü yok.</p>
            </div>
        </section>

        <!-- Tiers & Duration Selector -->
        <section class="relative pb-24">
            <!-- Period Selector Tabs -->
            <div class="flex flex-wrap justify-center items-center gap-2 md:gap-3 mb-12 max-w-3xl mx-auto px-4"
                id="period-selector">
                <button onclick="setPeriod(1)" id="period-btn-1"
                    class="period-btn px-4 py-2.5 rounded-xl text-sm font-medium transition-all duration-200 border border-white/10 bg-white/[0.03] text-slate-300 hover:border-white/20 hover:text-white">
                    1 Aylık
                </button>
                <button onclick="setPeriod(3)" id="period-btn-3"
                    class="period-btn px-4 py-2.5 rounded-xl text-sm font-medium transition-all duration-200 border border-white/10 bg-white/[0.03] text-slate-300 hover:border-white/20 hover:text-white">
                    3 Aylık <span
                        class="ml-1 text-[11px] px-1.5 py-0.5 rounded bg-teal-500/20 text-teal-300 font-semibold">%10
                        İndirim</span>
                </button>
                <button onclick="setPeriod(6)" id="period-btn-6"
                    class="period-btn px-4 py-2.5 rounded-xl text-sm font-medium transition-all duration-200 border border-white/10 bg-white/[0.03] text-slate-300 hover:border-white/20 hover:text-white">
                    6 Aylık <span
                        class="ml-1 text-[11px] px-1.5 py-0.5 rounded bg-teal-500/20 text-teal-300 font-semibold">%20
                        İndirim</span>
                </button>
                <button onclick="setPeriod(12)" id="period-btn-12"
                    class="period-btn px-4 py-2.5 rounded-xl text-sm font-medium transition-all duration-200 border border-neon-teal bg-neon-teal/15 text-white font-semibold shadow-lg shadow-teal-500/10">
                    12 Aylık <span
                        class="ml-1 text-[11px] px-1.5 py-0.5 rounded bg-teal-400 text-slate-950 font-bold">%30
                        İndirim</span>
                </button>
            </div>

            <div class="max-w-7xl mx-auto px-6 grid md:grid-cols-2 lg:grid-cols-3 gap-6 lg:gap-8" id="tiers"></div>
        </section>

        <!-- FAQ -->
        <section class="relative py-24 border-t border-white/5">
            <div class="max-w-3xl mx-auto px-6">
                <span class="section-label">SSS</span>
                <h2 class="reveal mt-6 font-display text-4xl md:text-5xl tracking-tight">Sık sorulan sorular.</h2>
                <div class="faq mt-10" id="faq"></div>
            </div>
        </section>

        <section class="relative py-28 text-center border-t border-white/5">
            <div class="max-w-3xl mx-auto px-6">
                <h2 class="font-display text-4xl md:text-5xl tracking-tight">Kurumunuza özel bir teklif hazırlayalım.
                </h2>
                <p class="mt-4 text-slate-300">30 dakika, hiçbir yükümlülük yok.</p>
                <div class="mt-8"><a href="iletisim.html" class="btn btn-primary">Özel Teklif Al →</a></div>
            </div>
        </section>
    </main>

    <div id="site-footer"></div>

    <script src="assets/js/layout.js"></script>
    <script>
        let currentPeriod = 12; // Varsayılan en avantajlı (12 Aylık) periyot

        const TIERS_DATA = [
            {
                id: "starter",
                name: "Başlangıç Paketi",
                capacity: "Maks. 5 Personel",
                desc: "Küçük klinik ve görüntüleme merkezleri için ideal başlangıç çözümü.",
                shopierUrl: "https://www.shopier.com/RADPYS/49366089",
                features: [
                    "Maks. 5 Personel Kapasitesi",
                    "Tüm 6 Modül Eksiksiz Dahil (SKS 6.1 Uyumlu)",
                    "AES-256 Yerel Veritabanı Şifreleme",
                    "E-posta ve Standart Uzak Masaüstü Desteği"
                ],
                cta: "Satın Al",
                highlight: false,
                prices: {
                    1: { total: "1.500 ₺", monthly: "1.500 ₺", note: null },
                    3: { total: "4.050 ₺", monthly: "1.350 ₺", note: "Aylık 1.350 ₺ (%10 İndirim)" },
                    6: { total: "7.200 ₺", monthly: "1.200 ₺", note: "Aylık 1.200 ₺ (%20 İndirim)" },
                    12: { total: "12.600 ₺", monthly: "1.050 ₺", note: "Aylık 1.050 ₺ (%30 İndirim)" }
                }
            },
            {
                id: "standard",
                name: "Standart Paket",
                capacity: "Maks. 15 Personel",
                desc: "Orta ölçekli sağlık ve görüntüleme merkezleri için en çok tercih edilen paket.",
                shopierUrl: "https://www.shopier.com/RADPYS/49366028",
                features: [
                    "Maks. 15 Personel Kapasitesi",
                    "Tüm 6 Modül Eksiksiz Dahil (SKS 6.1 Uyumlu)",
                    "AES-256 Yerel Veritabanı Şifreleme",
                    "Öncelikli Uzak Masaüstü ve Telefon Desteği"
                ],
                cta: "Hemen Satın Al",
                highlight: true,
                prices: {
                    1: { total: "3.500 ₺", monthly: "3.500 ₺", note: null },
                    3: { total: "9.450 ₺", monthly: "3.150 ₺", note: "Aylık 3.150 ₺ (%10 İndirim)" },
                    6: { total: "16.800 ₺", monthly: "2.800 ₺", note: "Aylık 2.800 ₺ (%20 İndirim)" },
                    12: { total: "29.400 ₺", monthly: "2.450 ₺", note: "Aylık 2.450 ₺ (%30 İndirim)" }
                }
            },
            {
                id: "pro",
                name: "Pro Paket",
                capacity: "Sınırsız Personel",
                desc: "Büyük hastaneler ve geniş radyoloji departmanları için tam kapsamlı kurumsal çözüm.",
                shopierUrl: "https://www.shopier.com/RADPYS/49366367",
                features: [
                    "Sınırsız Personel Kapasitesi",
                    "Tüm 6 Modül Eksiksiz Dahil (SKS 6.1 Uyumlu)",
                    "AES-256 Yerel Veritabanı Şifreleme",
                    "7/24 VIP Uzak Masaüstü ve Özel Kurulum Desteği"
                ],
                cta: "Satın Al",
                highlight: false,
                prices: {
                    1: { total: "7.000 ₺", monthly: "7.000 ₺", note: null },
                    3: { total: "18.900 ₺", monthly: "6.300 ₺", note: "Aylık 6.300 ₺ (%10 İndirim)" },
                    6: { total: "33.600 ₺", monthly: "5.600 ₺", note: "Aylık 5.600 ₺ (%20 İndirim)" },
                    12: { total: "58.800 ₺", monthly: "4.900 ₺", note: "Aylık 4.900 ₺ (%30 İndirim)" }
                }
            }
        ];

        function renderTiers() {
            [1, 3, 6, 12].forEach(p => {
                const btn = document.getElementById(`period-btn-${p}`);
                if (!btn) return;
                if (p === currentPeriod) {
                    btn.className = "period-btn px-4 py-2.5 rounded-xl text-sm font-semibold transition-all duration-200 border border-neon-teal bg-neon-teal/20 text-white shadow-lg shadow-teal-500/10 scale-105";
                } else {
                    btn.className = "period-btn px-4 py-2.5 rounded-xl text-sm font-medium transition-all duration-200 border border-white/10 bg-white/[0.03] text-slate-300 hover:border-white/20 hover:text-white";
                }
            });

            const periodLabel = currentPeriod === 1 ? "aylık" : `${currentPeriod} aylık toplam`;

            document.getElementById("tiers").innerHTML = TIERS_DATA.map(t => {
                const pInfo = t.prices[currentPeriod];
                const formattedTotal = pInfo.total.replace(" ₺", "&nbsp;₺");
                return `
      <div class="reveal is-visible relative flex flex-col justify-between h-full rounded-2xl border p-6 lg:p-7 xl:p-8 ${t.highlight ? "border-neon-teal/50 bg-slate-900/60" : "border-white/10 bg-white/[0.02]"}" style="${t.highlight ? "background:linear-gradient(180deg, rgba(20,184,166,0.1), rgba(15,23,42,0.6)); box-shadow:0 0 60px -15px rgba(20,184,166,0.4)" : ""}">
        <div>
          <div class="flex items-center justify-between gap-2">
            <h3 class="font-display text-2xl">${t.name}</h3>
            ${t.highlight ? `<span class="px-3 py-1 rounded-full text-[10px] font-mono uppercase tracking-[0.2em] font-bold" style="background:#14b8a6; color:#0a0f1e">En Popüler</span>` : ""}
          </div>
          <div class="mt-2 inline-block px-2.5 py-1 rounded-md text-xs font-mono font-semibold bg-white/5 border border-white/10 text-teal-300">
            ${t.capacity}
          </div>
          <p class="mt-3 text-sm text-slate-400" style="min-height:2.5rem">${t.desc}</p>
          <div class="mt-6">
            <div class="flex items-baseline flex-wrap gap-x-2 gap-y-1">
              <span class="font-display text-3xl sm:text-4xl lg:text-3xl xl:text-4xl tracking-tight whitespace-nowrap">${formattedTotal}</span>
              <span class="text-slate-400 text-sm whitespace-nowrap">/ ${periodLabel}</span>
            </div>
            ${pInfo.note ? `<div class="mt-1.5 text-xs text-teal-400 font-medium">${pInfo.note}</div>` : `<div class="mt-1.5 text-xs text-slate-500">Standart tarife</div>`}
          </div>
          <ul class="mt-8 space-y-3 border-t border-white/10 pt-6">
            ${t.features.map(f => `<li class="flex gap-3 text-sm text-slate-300"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#14b8a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-top:2px; flex-shrink:0"><polyline points="20 6 9 17 4 12"/></svg>${f}</li>`).join("")}
          </ul>
        </div>
        <div class="mt-10"><a href="${t.shopierUrl}" target="_blank" rel="noopener noreferrer" class="btn ${t.highlight ? "btn-primary" : "btn-outline"}" style="width:100%; justify-content:center">${t.cta}</a></div>
      </div>
    `;
            }).join("");
        }

        function setPeriod(p) {
            currentPeriod = p;
            renderTiers();
        }

        renderTiers();

        const FAQ = [
            { q: "Kapasite veya personel sayısı aşılırsa ne olur?", a: "Başlangıç paketi maks. 5, Standart paket maks. 15 personele kadar kullanım sağlar. Personel sayınız arttığında dilediğiniz zaman aradaki farkı ödeyerek üst pakete geçiş yapabilirsiniz." },
            { q: "Ödeme periyotları nasıl çalışır?", a: "1, 3, 6 veya 12 aylık periyotlarla peşin ödeme seçeneği mevcuttur. Daha uzun süreli periyotlarda aylık birim maliyet %30'a varan oranlarda düşmektedir." },
            { q: "Verilerimiz nerede saklanıyor?", a: "Varsayılan kurulumda verileriniz tamamen yerel olarak kendi bilgisayarınızda veya kendi yerel sunucunuzda AES-256 ile şifrelenerek saklanır. Dışarıdaki hiçbir bulut sunucusuna gönderilmez. Opsiyonel bulut yedekleme hizmetinde veriler Türkiye'deki KVKK uyumlu güvenli sunucularda yedeklenir." },
            { q: "Mevcut sistemimizden geçiş yapabilir miyiz?", a: "Evet. Excel ve CSV raporlarından toplu içe aktarma yapıyoruz. Geçiş desteği tüm paketlerde ilk 30 gün ücretsizdir." },
            { q: "Deneme sürümü var mı?", a: "Evet, 14 günlük ücretsiz deneme sunuyoruz. Kredi kartı bilgisi vermeniz gerekmez." },
        ];
        document.getElementById("faq").innerHTML = FAQ.map(f => `<details><summary>${f.q}</summary><p>${f.a}</p></details>`).join("");
    </script>
</body>

</html>
